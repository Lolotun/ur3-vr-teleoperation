# Real RTDE mode. Separate from the legacy Twist simulation configuration.
moveit_servo:
  use_gazebo: false
  command_in_type: speed_units
  scale:
    linear: 0.02
    rotational: 0.12
    joint: 0.4
  publish_period: 0.008
  low_latency_mode: false
  incoming_command_timeout: 0.1
  # Keep publishing stationary commands so the bridge can distinguish hold from failure.
  num_outgoing_halt_msgs_to_publish: 0
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: true
  publish_joint_accelerations: false
  smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
  is_primary_planning_scene_monitor: true
  move_group_name: manipulator
  # Must match the SRDF/KDL chain base. Twist arrives in UR's base frame;
  # Servo rotates it into base_link (UR's base differs by a 180-degree yaw).
  planning_frame: base_link
  ee_frame_name: teleop_tcp
  robot_link_command_frame: base
  joint_topic: /joint_states
  cartesian_command_in_topic: /teleop/servo/twist
  joint_command_in_topic: /teleop/servo/joint_jog
  command_out_topic: /teleop/servo/joint_trajectory
  status_topic: /teleop/servo/status
  lower_singularity_threshold: 17.0
  hard_stop_singularity_threshold: 30.0
  leaving_singularity_threshold_multiplier: 2.0
  joint_limit_margin: 0.1
  override_velocity_scaling_factor: 0.0
  # Enable only after validating the workcell collision geometry.
  check_collisions: false
  collision_check_rate: 5.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
  halt_all_joints_in_cartesian_mode: true
  halt_all_joints_in_joint_mode: true
