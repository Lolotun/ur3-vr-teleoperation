name: ur3-vr-teleoperation

services:
  teleop:
    image: ${TELEOP_IMAGE:-ur3-vr-teleoperation:humble}
    build:
      context: ./ros
    network_mode: host
    init: true
    environment:
      RTDE_ENABLE_MOTION: "${RTDE_ENABLE_MOTION:-false}"
      TELEOP_CONTROL_MODE: "${TELEOP_CONTROL_MODE:-STOP}"
      POLICY_MAX_LINEAR_SPEED: "${POLICY_MAX_LINEAR_SPEED:-0.020}"
      POLICY_MAX_ANGULAR_SPEED: "${POLICY_MAX_ANGULAR_SPEED:-0.12}"
      POLICY_TARGET_DISTANCE: "${POLICY_TARGET_DISTANCE:-0.03}"
      POLICY_TARGET_ROTATION: "${POLICY_TARGET_ROTATION:-0.17453292519943295}"
      POLICY_MAX_DISTANCE: "${POLICY_MAX_DISTANCE:-0.20}"
      POLICY_MAX_ROTATION: "${POLICY_MAX_ROTATION:-0.5}"
      RTDE_ENABLE_GRIPPER: "${RTDE_ENABLE_GRIPPER:-false}"
      RTDE_ENABLE_GRIPPER_FEEDBACK: "${RTDE_ENABLE_GRIPPER_FEEDBACK:-true}"
      RTDE_FREQUENCY: "${RTDE_FREQUENCY:-125.0}"
      RTDE_TRAJECTORY_TIMEOUT: "${RTDE_TRAJECTORY_TIMEOUT:-0.1}"
      RTDE_POSITION_GAIN: "${RTDE_POSITION_GAIN:-2.0}"
      RTDE_ROTATION_GAIN: "${RTDE_ROTATION_GAIN:-2.0}"
      RTDE_MAX_JOINT_TRACKING_ERROR: "${RTDE_MAX_JOINT_TRACKING_ERROR:-0.15}"
      RTDE_LEAD_SOFT_START: "${RTDE_LEAD_SOFT_START:-0.06}"
      RTDE_LEAD_SOFT_LIMIT: "${RTDE_LEAD_SOFT_LIMIT:-0.10}"
      RTDE_FLOOR_Z: "${RTDE_FLOOR_Z:--0.01}"
      RTDE_KINEMATICS_PARAMS_FILE: "${RTDE_KINEMATICS_PARAMS_FILE:-}"
      RTDE_TCP_XYZ: "${RTDE_TCP_XYZ:-[0.0, 0.0, 0.0]}"
      RTDE_TCP_RPY: "${RTDE_TCP_RPY:-[0.0, 0.0, 0.0]}"
      RTDE_LOWER_SINGULARITY_THRESHOLD: "${RTDE_LOWER_SINGULARITY_THRESHOLD:-17.0}"
      RTDE_HARD_STOP_SINGULARITY_THRESHOLD: "${RTDE_HARD_STOP_SINGULARITY_THRESHOLD:-30.0}"
      RTDE_POSITION_SCALE: "${RTDE_POSITION_SCALE:-1.0}"
      RTDE_MAPPING_YAW_DEG: "${RTDE_MAPPING_YAW_DEG:-180.0}"
      RTDE_MAX_DISPLACEMENT: "${RTDE_MAX_DISPLACEMENT:-0.25}"
      RTDE_MAX_ROTATION: "${RTDE_MAX_ROTATION:-1.0}"
      RTDE_MAX_LINEAR_SPEED: "${RTDE_MAX_LINEAR_SPEED:-0.020}"
      RTDE_MAX_ANGULAR_SPEED: "${RTDE_MAX_ANGULAR_SPEED:-0.12}"
      RTDE_COMMAND_TIMEOUT: "${RTDE_COMMAND_TIMEOUT:-0.25}"
      RTDE_FEEDBACK_TIMEOUT: "${RTDE_FEEDBACK_TIMEOUT:-0.25}"
      RTDE_LOOKAHEAD_TIME: "${RTDE_LOOKAHEAD_TIME:-0.1}"
      RTDE_GAIN: "${RTDE_GAIN:-300.0}"
      ROBOT_IP: "${ROBOT_IP:-}"
      ROBOT_PORT: "${ROBOT_PORT:-30002}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-11}"
      ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-1}"
      ROS_TCP_PORT: "${ROS_TCP_PORT:-10000}"
      TWIST_COMMAND_TOPIC: /team_1/twist_command
      TWIST_COMMAND_SAFE_TOPIC: /team_1/twist_command_safe
      GRIPPER_COMMAND_TOPIC: /team_1/gripper_command
      ENABLE_GRIPPER: "${ENABLE_GRIPPER:-true}"
      GRIPPER_PORT: "${GRIPPER_PORT:-63352}"
      GRIPPER_OPEN_POSITION: "${GRIPPER_OPEN_POSITION:-0}"
      GRIPPER_CLOSE_POSITION: "${GRIPPER_CLOSE_POSITION:-255}"
      GRIPPER_SPEED: "${GRIPPER_SPEED:-180}"
      GRIPPER_FORCE: "${GRIPPER_FORCE:-20}"
      SPEEDL_ENABLE_STATE_FEEDBACK: "${SPEEDL_ENABLE_STATE_FEEDBACK:-true}"
      SPEEDL_SEND_HZ: "${SPEEDL_SEND_HZ:-8.0}"
      SPEEDL_MAX_LINEAR_SPEED: "${SPEEDL_MAX_LINEAR_SPEED:-0.020}"
      SPEEDL_MAX_ANGULAR_SPEED: "${SPEEDL_MAX_ANGULAR_SPEED:-0.0}"
      SPEEDL_ACCELERATION: "${SPEEDL_ACCELERATION:-0.10}"
      SPEEDL_COMMAND_DURATION: "${SPEEDL_COMMAND_DURATION:-0.14}"
      SPEEDL_STALE_TIMEOUT_SEC: "${SPEEDL_STALE_TIMEOUT_SEC:-0.18}"
      SPEEDL_CONNECT_TIMEOUT_SEC: "${SPEEDL_CONNECT_TIMEOUT_SEC:-0.06}"
      SPEEDL_DEADBAND: "${SPEEDL_DEADBAND:-0.002}"
      SPEEDL_LINEAR_X_SIGN: "${SPEEDL_LINEAR_X_SIGN:--1.0}"
      SPEEDL_LINEAR_Y_SIGN: "${SPEEDL_LINEAR_Y_SIGN:--1.0}"
      SPEEDL_LINEAR_Z_SIGN: "${SPEEDL_LINEAR_Z_SIGN:-1.0}"
      SPEEDL_ANGULAR_X_SIGN: "${SPEEDL_ANGULAR_X_SIGN:-1.0}"
      SPEEDL_ANGULAR_Y_SIGN: "${SPEEDL_ANGULAR_Y_SIGN:-1.0}"
      SPEEDL_ANGULAR_Z_SIGN: "${SPEEDL_ANGULAR_Z_SIGN:-1.0}"
    command: ["${TELEOP_MODE:-wifi_speedl}"]
